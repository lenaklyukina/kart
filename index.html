        function getPrediction() {
            const card = document.getElementById('tarotCard');
            const cardNumber = document.getElementById('cardNumber');
            const cardImg = document.getElementById('cardImg');
            const cardName = document.getElementById('cardName');
            const cardMeaning = document.getElementById('cardMeaning');
            const predictionWrapper = document.getElementById('predictionWrapper');
            const predictionText = document.getElementById('predictionText');
            
            // Add shuffle animation
            card.classList.remove('flipped');
            card.classList.add('shuffling');
            
            // Hide prediction
            predictionWrapper.classList.remove('show');
            
            setTimeout(() => {
                // Random card
                const randomIndex = Math.floor(Math.random() * tarotCards.length);
                const selectedCard = tarotCards[randomIndex];
                
                // Update card content
                cardNumber.textContent = selectedCard.number;
                cardImg.src = selectedCard.image;
                cardName.textContent = selectedCard.name;
                cardMeaning.textContent = selectedCard.meaning;
                
                // Remove shuffle and flip
                card.classList.remove('shuffling');
                
                setTimeout(() => {
                    card.classList.add('flipped');
                    
                    // Show prediction after card flip
                    setTimeout(() => {
                        predictionText.innerHTML = `
                            <strong style="color: #d4af37; font-family: 'Cinzel', serif; font-size: 1.3em; display: block; margin-bottom: 20px; text-shadow: 0 0 10px rgba(212, 175, 55, 0.6);">
                                ✦ Послание карт Таро ✦
                            </strong>
                            <p style="margin-bottom: 20px; font-size: 1.2em;">
                                <strong style="color: #f4e4c1; font-family: 'Cinzel', serif;">${selectedCard.number}. ${selectedCard.name}</strong>
                            </p>
                            <p style="margin-bottom: 20px; font-style: italic; color: #d4af37; font-size: 1.1em;">
                                ${selectedCard.meaning}
                            </p>
                            <p style="color: #f4e4c1; font-size: 1.15em; line-height: 1.9;">
                                ${selectedCard.prediction}
                            </p>
                            <p style="margin-top: 25px; font-style: italic; color: #d4af37; font-size: 1.1em;">
                                ✧ С любовью и светом, Елена 🕯️ ✧
                            </p>
                        `;
                        predictionWrapper.classList.add('show');
                        
                        // Smooth scroll to prediction
                        setTimeout(() => {
                            predictionWrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }, 300);
                    }, 500);
                }, 400);
            }, 600);
        }
    </script>
